config-version = 2

# ============================================================
# STARTUP
# ============================================================

start-at-login = true

# Mirrors Omarchy's autostart.lua (browser, then terminal after a short delay)
after-startup-command = [
    'exec-and-forget open -na "Google Chrome"',
    'exec-and-forget sh -c "sleep 7 && open -na Ghostty"',
    'workspace 1'
]

# ============================================================
# LAYOUT / NORMALIZATION
# ============================================================

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

# ============================================================
# FLOATING WINDOW RULES
# ============================================================

[[on-window-detected]]
if.app-name-regex-substring = 'telegram'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'whatsapp'
run = 'layout floating'

# ============================================================
# KEY MAPPING
# ============================================================

[key-mapping]
preset = 'qwerty'

# ============================================================
# GAPS
# Matches Hyprland looknfeel.lua (gaps_in = 0, gaps_out = 0)
# ============================================================

[gaps]
inner.horizontal = 0
inner.vertical =   0
outer.left =       0
outer.bottom =     0
outer.top =        0
outer.right =      0

# ============================================================
# MAIN MODE BINDINGS
# ============================================================

[mode.main.binding]

# ---- Window state ----
alt-f = 'fullscreen'
alt-u = 'layout tiles horizontal vertical'
alt-q = "close --quit-if-last-window"

# ---- Focus navigation (SUPER+HJKL) ----
alt-h = 'focus left --boundaries-action wrap-around-the-workspace'
alt-j = 'focus down --boundaries-action wrap-around-the-workspace'
alt-k = 'focus up --boundaries-action wrap-around-the-workspace'
alt-l = 'focus right --boundaries-action wrap-around-the-workspace'

# ---- Move window (SUPER+SHIFT+HJKL) ----
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# ---- Workspaces ----
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'
alt-shift-0 = 'move-node-to-workspace 10 --focus-follows-window'

# ---- Terminal (SUPER+RETURN / SUPER+ALT+RETURN) ----
alt-enter = 'exec-and-forget open -n /Applications/Ghostty.app'
# alt-ctrl-enter = 'exec-and-forget open -na Ghostty --args -e "tmux new"'

# ---- Apps ----
alt-b = 'exec-and-forget open -n /Applications/"Google Chrome.app"'
alt-d = 'exec-and-forget open -a /Applications/Raycast.app'
alt-o = 'exec-and-forget open -n /Applications/Obsidian.app'
alt-m = 'exec-and-forget open -n /Applications/Spotify.app'
alt-n = 'exec-and-forget open -na Ghostty --args -e nvim'
alt-s = 'exec-and-forget open -na Ghostty --args -e opencode'

# ---- Webapps ----
alt-a = 'exec-and-forget open -na "Google Chrome" --args --app="https://chatgpt.com"'
alt-shift-a = 'exec-and-forget open -na "Google Chrome" --args --app="https://claude.ai/new"'

# ---- Finder / private browsing ----
alt-shift-f = 'exec-and-forget open -a "Finder" ~'
alt-shift-b = 'exec-and-forget open -na "Google Chrome" --args --incognito'
